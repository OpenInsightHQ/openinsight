services:
  openinsight-pi-agent:
    image: ghcr.io/openinsighthq/one-pi:latest
    container_name: openinsight-pi-agent
    user: root
    networks:
      - openinsight_default
#    ports:
#      - "13300:3000"
    env_file:
      - .env
    environment:
      - HOME=/home/codeuser
      # Persistent pip/npm caches inside the pi-data volume (speed up skill
      # dependency re-installs; without these the caches live in the container
      # layer and are lost on every restart/recreate).
      - PIP_CACHE_DIR=/home/codeuser/.pi/.cache/pip
      - npm_config_cache=/home/codeuser/.pi/.cache/npm
      # Optional mirrors for CN environments (skill dependency installs):
      # - PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple
      # - npm_config_registry=https://registry.npmmirror.com
    volumes:
      - ./pi-data:/home/codeuser/.pi
      - ./skill-repo:/app/skill-repo
    working_dir: /app
    command: npx pi --http --http-port ${PI_HTTP_PORT:-3000} --provider ${PI_PROVIDER} --model ${PI_MODEL}
    restart: unless-stopped
networks:
  openinsight_default:
    external: true
