services:
  openinsight-searxng:
    image: searxng/searxng:latest
    container_name: openinsight-searxng
    restart: unless-stopped
      #ports:
      #- "127.0.0.1:8888:8080"
    volumes:
      - ./config:/etc/searxng
      - ./data:/var/cache/searxng
    networks:
      - openinsight_default
    environment:
      - SEARXNG_BIND_ADDRESS=0.0.0.0
      - SEARXNG_PORT=8080
      - FORCE_OWNERSHIP=false
      # Optional for public instances:
      # - SEARXNG_BASE_URL=http://<server-ip-or-domain>:8888/
      # - SEARXNG_LIMITER=true
      # - SEARXNG_PUBLIC_INSTANCE=true


  openinsight-mcp-searxng:
    image: ghcr.io/openinsighthq/mcp-searxng:latest
    container_name: openinsight-mcp-searxng
    restart: unless-stopped
    environment:
      - SEARXNG_URL=http://openinsight-searxng:8080
      - MCP_HTTP_PORT=3000
      - MCP_HTTP_HOST=0.0.0.0
      - NO_PROXY=NO_PROXY=openinsight-searxng,localhost,127.0.0.1,.local
        #ports:
        #- "127.0.0.1:3001:3000"
    networks:
      - openinsight_default

  openinsight-mcp-searxng-proxy:
    image: ghcr.io/openinsighthq/mcp-searxng-proxy:latest
    container_name: openinsight-mcp-searxng-proxy
    restart: unless-stopped
    environment:
      - UPSTREAM_URL=http://openinsight-mcp-searxng:3000/mcp
      - PORT=3000
        #ports:
        #- "127.0.0.1:3002:3000"
    networks:
      - openinsight_default

networks:
  openinsight_default:
    external: true
